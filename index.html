            width: 85%; max-width: 450px; padding: 15px 25px;

        .container { 
            width: 90%; max-width: 420px; background: var(--card-bg); padding: 35px 25px; 
            border-radius: 40px; margin: 20px 0; backdrop-filter: blur(25px);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8); 
            text-align: center; display: none; border: 1px solid rgba(0, 242, 255, 0.2);
            position: relative; overflow: hidden;
        }

        .hero-box { position: relative; display: inline-block; margin-bottom: 30px; }
        .hero-img {
            font-size: 6rem; position: relative; z-index: 2;
            filter: drop-shadow(0 0 20px var(--primary));
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        .menu-btn { 
            width: 100%; padding: 20px; margin: 15px 0; border: none; border-radius: 20px; 
            font-weight: 900; cursor: pointer; 
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); 
            color: #030712; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px;
            border-bottom: 4px solid rgba(0,0,0,0.2);
        }
        .menu-btn:active { transform: scale(0.95); }

        .lvl-btn { border-left: 5px solid transparent; text-align: left; padding-left: 30px; }
        .lvl-btn:hover { border-left: 5px solid var(--primary); background: rgba(255,255,255,0.05); }

        .timer-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 25px; }
        #timer-bar { width: 100%; height: 100%; background: var(--primary); box-shadow: 0 0 15px var(--primary); border-radius: 10px; }

        .hud-stat { 
            background: rgba(255,255,255,0.05); padding: 12px 20px; border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; font-weight: bold;
        }

        .option-btn { 
            width: 100%; padding: 18px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 22px; background: rgba(255,255,255,0.02); color: white; cursor: pointer; 
            text-align: left; transition: 0.3s; font-size: 1rem; position: relative;
        }
        .option-btn:hover { background: rgba(0, 242, 255, 0.1); border-color: var(--primary); }
        
        .correct { background: var(--success) !important; color: #030712 !important; font-weight: bold; border: none !important; box-shadow: 0 0 20px var(--success); }
        .wrong { background: var(--danger) !important; border: none !important; animation: rare-shake 0.4s; }

        @keyframes rare-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 60% { transform: translateX(8px); } }

        #leaderboard-content {

        }

        .lb-row {

            border-bottom: 1px solid rgba(255,255,255,0.05);

const AudioEngine = {
    ctx: null, isMusicPlaying: false,
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    playBGM() {
        if (this.isMusicPlaying) return;
        this.init(); this.isMusicPlaying = true;
        const playPad = (freq, time, duration, vol) => {
            const osc = this.ctx.createOscillator(); const g = this.ctx.createGain(); const filter = this.ctx.createBiquadFilter();
            osc.type = 'sine'; filter.type = 'lowpass'; filter.frequency.value = 400;
            osc.frequency.setValueAtTime(freq, time); g.gain.setValueAtTime(0, time);
            g.gain.linearRampToValueAtTime(vol, time + 1); g.gain.linearRampToValueAtTime(0, time + duration);
            osc.connect(filter); filter.connect(g); g.connect(this.ctx.destination);
            osc.start(time); osc.stop(time + duration);
        };
        let startTime = this.ctx.currentTime;
        const loFiLoop = () => {
            const chords = [[261.63, 329.63, 392.00, 493.88], [220.00, 261.63, 329.63, 392.00], [174.61, 220.00, 261.63, 349.23], [196.00, 246.94, 293.66, 392.00]];
            chords.forEach((chord, i) => { chord.forEach(note => { playPad(note, startTime + (i * 4), 4.2, 0.04); }); });
            startTime += 16; setTimeout(loFiLoop, 16000);
        };
        loFiLoop();
    },
    playClick() { this.init(); const osc = this.ctx.createOscillator(); const g = this.ctx.createGain(); osc.frequency.setValueAtTime(600, this.ctx.currentTime); g.gain.setValueAtTime(0.2, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1); osc.connect(g); g.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.1); },
    playCorrect() { this.init(); const osc = this.ctx.createOscillator(); const g = this.ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(523, this.ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(659, this.ctx.currentTime + 0.2); g.gain.setValueAtTime(0.2, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3); osc.connect(g); g.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.3); },
    playWrong() { this.init(); const osc = this.ctx.createOscillator(); const g = this.ctx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(110, this.ctx.currentTime); g.gain.setValueAtTime(0.2, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4); osc.connect(g); g.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.4); }
};

        {q:"Lightest metal?", o:["Lithium","Sodium","Magnesium"], a:0},
        {q:"SI unit of Luminous Intensity?", o:["Lumen","Lux","Candela"], a:2},
        {q:"Who gave Uncertainty Principle?", o:["Heisenberg","Einstein","Dirac"], a:0},

};

let score = 0, lives = 3, qIndex = 0, timer, timeLeft = 10, currentQuestions = [];

function startWithSound() { AudioEngine.playClick(); AudioEngine.playBGM(); showScreen('level-screen'); }
function showScreen(id) { document.querySelectorAll('.container').forEach(c => { if(c.id !== 'leader-board-screen') c.style.display = 'none'; }); document.getElementById(id).style.display = 'block'; }
function startGame(lvl) { AudioEngine.playClick(); currentQuestions = [...questionBank[lvl]].sort(() => Math.random() - 0.5); score = 0; lives = 3; qIndex = 0; showScreen('game-screen'); loadQuestion(); }

function loadQuestion() {
    if (qIndex >= currentQuestions.length || lives <= 0) return finish();
    timeLeft = 10; const bar = document.getElementById('timer-bar'); bar.style.transition = 'none'; bar.style.width = '100%';
    setTimeout(() => { bar.style.transition = 'width 10s linear'; bar.style.width = '0%'; }, 50);
    clearInterval(timer); timer = setInterval(() => { timeLeft--; if (timeLeft <= 0) { AudioEngine.playWrong(); handleWrong(); } }, 1000);
    const q = currentQuestions[qIndex]; document.getElementById('question').innerText = q.q; document.getElementById('score').innerText = score; document.getElementById('lives').innerText = lives;
    const container = document.getElementById('options-container'); container.innerHTML = '';
    q.o.forEach((opt, i) => { const btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt; btn.onclick = () => check(i, btn); container.appendChild(btn); });
}

function check(idx, btn) {
    clearInterval(timer); const correct = currentQuestions[qIndex].a;
    if (idx === correct) { AudioEngine.playCorrect(); btn.classList.add('correct'); score += 10 + timeLeft; setTimeout(() => { qIndex++; loadQuestion(); }, 600); }
    else { AudioEngine.playWrong(); btn.classList.add('wrong'); document.querySelectorAll('.option-btn')[correct].classList.add('correct'); handleWrong(); }
}

function handleWrong() { lives--; if (lives <= 0) setTimeout(finish, 1000); else setTimeout(() => { qIndex++; loadQuestion(); }, 1000); }
function finish() { clearInterval(timer); showScreen('result-screen'); document.getElementById('final-score-display').innerText = score; }

// UPDATED FOR 50 MEMBERS
function saveAndShowLeaderboard() {
    const name = document.getElementById('player-name').value.trim(); if (!name) return alert("Agent ID Req!");
    let lb = JSON.parse(localStorage.getItem('sq_leaderboard')) || [];
    lb.push({ name, score }); 
    lb.sort((a, b) => b.score - a.score); 
    lb = lb.slice(0, 50); // LIMIT INCREASED TO 50
    localStorage.setItem('sq_leaderboard', JSON.stringify(lb));
    document.getElementById('save-section').innerHTML = "<h3 style='color:var(--success)'>XP RECORDED</h3>"; renderLeaderboard();
}

function renderLeaderboard() {
    const lb = JSON.parse(localStorage.getItem('sq_leaderboard')) || [];
    const container = document.getElementById('leaderboard-content');
    container.innerHTML = lb.map((e, i) => `<div class="lb-row ${i === 0 ? 'rank-1' : ''}"><span>#${i+1} ${e.name}</span><span>${e.score} XP</span></div>`).join('');
    if(lb[0]) document.getElementById('top-val').innerText = lb[0].score;
}

function shareToWhatsApp() { const msg = `I scored ${score} XP in Science Quest! Developed by Rehan, Naveen & Ahmad Raza. Beat me? 🔬`; window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`); }
window.onload = renderLeaderboard;
</script>
